[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basu-data-reconciliation"
version = "0.3.0"
description = "Configurable source-to-target data reconciliation for CSV and Excel datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["reconciliation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
